name: Zig Compat

on:
  workflow_call:
    inputs:
      distros:
        description: "JSON array of distro names to test (e.g. [\"arch\",\"debian\",\"ubuntu-arm64\"])"
        required: false
        type: string
        default: '["arch","debian","openmandriva","ubuntu","fedora","arch-arm64","debian-arm64","openmandriva-arm64","ubuntu-arm64","fedora-arm64","arch-riscv64","debian-riscv64","ubuntu-riscv64","fedora-riscv64"]'
      package-group:
        description: "Package group to install in containers: x11-base, x11-full"
        required: false
        type: string
        default: "x11-base"
      zig-version:
        description: "Zig version to install in containers"
        required: false
        type: string
        default: "0.15.2"
      image-prefix:
        description: "Docker image name prefix (e.g. dusk-compat, liminal-compat)"
        required: true
        type: string
      test-commands:
        description: "Newline-separated build/test commands to run inside the container"
        required: false
        type: string
        default: |
          zig build
          zig build test
      x11-test-commands:
        description: "Commands to run under Xvfb (empty = skip X11 tests)"
        required: false
        type: string
        default: ""
      sibling-repos:
        description: "Space-separated list of org/repo to mount beside /src"
        required: false
        type: string
        default: ""
    secrets:
      REPO_TOKEN:
        description: "Token with read access to private sibling repositories"
        required: false
      REPO_SSH_KEY:
        description: "SSH deploy key with read access to private sibling repositories"
        required: false

jobs:
  compat:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(inputs.distros) }}

    steps:
      - uses: actions/checkout@v6

      - name: Checkout shared workflows
        uses: actions/checkout@v6
        with:
          repository: tenebrux/github-workflows
          path: .github-workflows
          sparse-checkout: |
            dockerfiles
            scripts

      - name: Checkout sibling repositories
        if: inputs.sibling-repos != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          REPO_SSH_KEY: ${{ secrets.REPO_SSH_KEY }}
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          if [ -n "$REPO_SSH_KEY" ]; then
            key_file="$RUNNER_TEMP/tenebrux-repo-key"
            printf '%s\n' "$REPO_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
          fi
          read -r -a repos <<< "$SIBLING_REPOS"
          for repo in "${repos[@]}"; do
            name="${repo##*/}"
            if [ -n "$REPO_TOKEN" ]; then
              GH_TOKEN="$REPO_TOKEN" gh repo clone "$repo" "../${name}" -- --depth 1
            elif [ -n "$REPO_SSH_KEY" ]; then
              GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
                git clone --depth 1 "git@github.com:${repo}.git" "../${name}"
            else
              gh repo clone "$repo" "../${name}" -- --depth 1
            fi
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine platform
        id: platform
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          case "$DISTRO" in
            *-arm64)   echo "platform=linux/arm64"   >> "$GITHUB_OUTPUT" ;;
            *-riscv64) echo "platform=linux/riscv64" >> "$GITHUB_OUTPUT" ;;
            *)         echo "platform=linux/amd64"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Determine Dockerfile
        id: base
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          echo "dockerfile=Dockerfile.${DISTRO}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github-workflows/dockerfiles/${{ steps.base.outputs.dockerfile }}
          platforms: ${{ steps.platform.outputs.platform }}
          tags: ${{ inputs.image-prefix }}-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,scope=${{ matrix.distro }},mode=max
          build-args: |
            ZIG_VERSION=${{ inputs.zig-version }}
            PACKAGE_GROUP=${{ inputs.package-group }}

      - name: Run tests
        env:
          TEST_COMMANDS: ${{ inputs.test-commands }}
          X11_TEST_COMMANDS: ${{ inputs.x11-test-commands }}
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
          PLATFORM: ${{ steps.platform.outputs.platform }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
          DISTRO: ${{ matrix.distro }}
        run: |
          mount_args=()
          repos=()
          if [ -n "$SIBLING_REPOS" ]; then
            read -r -a repos <<< "$SIBLING_REPOS"
          fi
          for repo in "${repos[@]}"; do
            name="${repo##*/}"
            mount_args+=(--volume "${GITHUB_WORKSPACE}/../${name}:/${name}:ro")
          done
          docker run --rm \
            --platform "$PLATFORM" \
            "${mount_args[@]}" \
            -e TEST_COMMANDS="$TEST_COMMANDS" \
            -e X11_TEST_COMMANDS="$X11_TEST_COMMANDS" \
            --name "${IMAGE_PREFIX}-${DISTRO}" \
            "${IMAGE_PREFIX}-${DISTRO}:ci"
