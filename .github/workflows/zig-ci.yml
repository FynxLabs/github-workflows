name: Zig CI

on:
  workflow_call:
    inputs:
      zig-fmt-paths:
        description: "Paths to check with zig fmt (space-separated)"
        required: false
        type: string
        default: "src/"
      build-args:
        description: "Extra arguments passed to zig build"
        required: false
        type: string
        default: ""
      test-args:
        description: "Extra arguments passed to zig build test"
        required: false
        type: string
        default: ""
      system-deps:
        description: "Package group to install: none, x11-base, x11-full"
        required: false
        type: string
        default: "none"
      mise-version:
        description: "mise version to use (pinned to avoid 'latest' 404s)"
        required: false
        type: string
        default: "2026.4.10"
      sibling-repos:
        description: "Space-separated list of org/repo to checkout as siblings (e.g. 'tenebrux/liminal')"
        required: false
        type: string
        default: ""
    secrets:
      REPO_TOKEN:
        description: "Token with read access to private sibling repositories"
        required: false
      REPO_SSH_KEY:
        description: "SSH deploy key with read access to private sibling repositories"
        required: false

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sibling repositories
        if: inputs.sibling-repos != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          REPO_SSH_KEY: ${{ secrets.REPO_SSH_KEY }}
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
        run: |
          if [ -n "$REPO_SSH_KEY" ]; then
            key_file="$RUNNER_TEMP/tenebrux-repo-key"
            printf '%s\n' "$REPO_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
          fi
          read -r -a repos <<< "$SIBLING_REPOS"
          for repo in "${repos[@]}"; do
            name="${repo##*/}"
            if [ -n "$REPO_TOKEN" ]; then
              GH_TOKEN="$REPO_TOKEN" gh repo clone "$repo" "../${name}" -- --depth 1
            elif [ -n "$REPO_SSH_KEY" ]; then
              GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
                git clone --depth 1 "git@github.com:${repo}.git" "../${name}"
            else
              gh repo clone "$repo" "../${name}" -- --depth 1
            fi
          done

      - uses: jdx/mise-action@v4
        with:
          version: ${{ inputs.mise-version }}

      - name: Install system dependencies (x11-base)
        if: inputs.system-deps == 'x11-base' || inputs.system-deps == 'x11-full'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-util-dev \
            libxcb-ewmh-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-render-util0-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-cursor-dev \
            libxcb-xfixes0-dev \
            libxcb-composite0-dev \
            libxcb-xtest0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libcairo2-dev \
            libpango1.0-dev

      - name: Install system dependencies (x11-full)
        if: inputs.system-deps == 'x11-full'
        run: |
          sudo apt-get install -y \
            librsvg2-dev \
            libgdk-pixbuf-2.0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev

      - name: Build
        run: zig build ${{ inputs.build-args }}

      - name: Test
        run: zig build test ${{ inputs.test-args }}

      - name: Lint
        if: inputs.zig-fmt-paths != ''
        run: zig fmt --check ${{ inputs.zig-fmt-paths }}
